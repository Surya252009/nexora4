
name: NEXORA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NEXORA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE="NEXORA_Android_Project_Starter.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Android project ZIP not found!"
            ls -la
            exit 1
          fi

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Project
        run: |
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts
          test -f android-project/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          gradle -p android-project assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-project/app/build/outputs/apk/debug/

      - name: Upload NEXORA APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
